services:
  - type: web
    name: qfa-dashboard-fintech
    env: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: panel serve app.py --address 0.0.0.0 --port $PORT --allow-websocket-origin=${RENDER_EXTERNAL_HOSTNAME} --num-procs 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOKEH_ALLOW_WS_ORIGIN
        value: ${RENDER_EXTERNAL_HOSTNAME}
