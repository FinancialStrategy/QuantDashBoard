services:
  - type: web
    name: qfa-dashboard-fintech
    env: python
    plan: starter
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: panel serve app.py --address 0.0.0.0 --port $PORT --allow-websocket-origin=${RENDER_EXTERNAL_HOSTNAME} --num-procs 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: QFA_OUTPUT_DIR
        value: QFA_Dashboard_FinTECH_reports
      - key: BOKEH_LOG_LEVEL
        value: info
