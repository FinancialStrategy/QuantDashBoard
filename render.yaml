services:
  - type: web
    name: qfa-v13-institutional-terminal
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: QFA_MAX_TICKERS
        value: "18"
      - key: QFA_CACHE_TTL
        value: "900"
